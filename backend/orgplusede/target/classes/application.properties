# ─────────────────────────────────────────────
#  Application
# ─────────────────────────────────────────────
spring.application.name=orgpluse

# ─────────────────────────────────────────────
#  MySQL DataSource
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3307/orgpluse
spring.datasource.username=root
spring.datasource.password=ROOT
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
#  JPA / Hibernate 7
#  - dialect line removed: Hibernate 7 auto-detects MySQL from the JDBC URL
#  - jdbc.time_zone=UTC added for Boot 4 / Hibernate 7
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─────────────────────────────────────────────
#  File Upload (for FileStorageConfiguration)
# ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# ─────────────────────────────────────────────
#  Server
# ─────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────
#  JWT
# ─────────────────────────────────────────────
jwt.secret=T3JnUGx1c2VTZWN1cmVLZXkyMDI1IS1IUk1TOTk5

# ─────────────────────────────────────────────
#  Logging
# ─────────────────────────────────────────────
logging.level.com.orgpluse=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG


